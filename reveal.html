<script>
// Aparición progresiva al hacer scroll (fade + deslizamiento), escalonada por bloque.
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var main = document.querySelector("#quarto-document-content") || document.body;
  var targets = [];
  main.querySelectorAll("h2, .reveal, section.level2 > p, section.level2 > ul, section.level2 > .cell").forEach(function (el) {
    if (el.closest(".reveal") && !el.classList.contains("reveal")) return;
    el.classList.add("reveal"); targets.push(el);
  });
  if (reduce || !("IntersectionObserver" in window)) { targets.forEach(function (e) { e.classList.add("visible"); }); return; }
  document.documentElement.classList.add("reveal-enabled");
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  targets.forEach(function (el) { io.observe(el); });
  // viñetas escalonadas dentro de cada bloque
  document.querySelectorAll(".cv-bloque li, section.level2 > ul li").forEach(function (li, i) {
    li.style.setProperty("--d", ((i % 6) * 70) + "ms");
  });
})();
</script>
